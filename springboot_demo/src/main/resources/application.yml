spring:
  application:
    name: productapi

  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      enabled: true          # solo per sviluppo
      path: /h2-console

  jpa:
    open-in-view: false      # evita query lazy nel layer web
    hibernate:
      ddl-auto: validate     # lo schema lo gestisce Flyway, Hibernate controlla soltanto
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true          # errori standard RFC 9457
  web:
    error:
      include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
